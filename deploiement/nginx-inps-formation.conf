# /etc/nginx/sites-available/inps-formation.conf — à adapter (nom de domaine, certificats)
server {
    listen 80;
    server_name formation.exemple.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name formation.exemple.invalid;

    ssl_certificate     /etc/ssl/inps/formation.crt;      # certificat fourni par l'INPS ou Let's Encrypt
    ssl_certificate_key /etc/ssl/inps/formation.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/inps-formation/public;   # SEUL le dossier public est exposé
    index index.php;
    client_max_body_size 14m;
    server_tokens off;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sql|zip)$ { deny all; }

    access_log /var/log/nginx/inps-formation.access.log;
    error_log  /var/log/nginx/inps-formation.error.log;
}
