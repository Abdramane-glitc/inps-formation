# Variante Apache 2.4 (mod_ssl, mod_rewrite, mod_proxy_fcgi)
<VirtualHost *:80>
    ServerName formation.exemple.invalid
    Redirect permanent / https://formation.exemple.invalid/
</VirtualHost>
<VirtualHost *:443>
    ServerName formation.exemple.invalid
    DocumentRoot /var/www/inps-formation/public
    SSLEngine on
    SSLCertificateFile    /etc/ssl/inps/formation.crt
    SSLCertificateKeyFile /etc/ssl/inps/formation.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ServerSignature Off
    <Directory /var/www/inps-formation/public>
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/inps-formation.error.log
    CustomLog ${APACHE_LOG_DIR}/inps-formation.access.log combined
</VirtualHost>
