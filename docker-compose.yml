# Configuration Docker de RÉFÉRENCE (facultative ; non obligatoire sous Windows).
# 1. cp .env.example .env  puis renseigner DB_PASSWORD, DB_ROOT_PASSWORD, BACKUP_PASSWORD, APP_URL
# 2. docker compose up -d --build
# 3. docker compose exec app php artisan key:generate --force   (puis redémarrer : docker compose restart app)
# 4. docker compose exec app php artisan migrate --seed --force
# 5. docker compose exec app php artisan inps:creer-admin
# Le TLS (HTTPS) est assuré par un proxy inverse en amont (voir docs/INSTALLATION_PRODUCTION.md).
services:
  app:
    build: { context: ., target: app }
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - stockage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    ports:
      - "127.0.0.1:8080:80"   # exposé uniquement en local : publier via le proxy HTTPS
    depends_on: [app]
    restart: unless-stopped

  planificateur:
    build: { context: ., target: app }
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - stockage:/var/www/html/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on: [app]
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin-trust-function-creators=1"]
    volumes:
      - donnees:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    # Aucun port publié : la base n'est jamais accessible depuis l'extérieur.

volumes:
  stockage:
  donnees:
